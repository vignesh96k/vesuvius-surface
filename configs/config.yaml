# Master experiment configuration — Surface Detection (3D).

experiment:
  name: vesuvius_surface_baseline
  output_dir: "/mnt/workspace/code/outputs"
  seed: 42
  deterministic: true
  device: cuda  # cuda | cpu | mps

data:
  # Absolute path or repo-relative. Default junction: data/ -> Downloads extract.
  root: "/mnt/workspace/code/datasets/vesuvius-challenge-surface-detection"
  num_workers: 4
  pin_memory: true
  batch_size: 2

  # 3D patch extraction (D, H, W)
  patch_size: [128, 128, 128]
  stride: [64, 64, 64]
  pad_value: 0.0
  ignore_index: 2
  min_labeled_ratio: 0.1
  min_foreground_ratio: 0.0

  # Intensity normalization: none | minmax | zscore | percentile
  normalize: zscore
  normalize_kwargs: {}

  # Scroll-aware splits (preferred over random patches)
  train_scroll_ids: null
  val_scroll_ids: null
  train_volume_ids: null
  val_volume_ids: null

  transforms:
    train:
      enabled: true
      flip_p: 0.5
      rot90_p: 0.5
    eval:
      enabled: false

paths:
  config_dir: "/mnt/workspace/code/vesuvius-surface/configs"
  checkpoint_dir: "/mnt/workspace/code/checkpoints"
  cache: "/mnt/workspace/code/cache"
