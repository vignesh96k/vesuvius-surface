[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius-evaluation"
version = "0.1.0"
description = "Standalone competition-metric scorer for Vesuvius Surface Detection submissions (official topometrics wrapper + pure-Python fallback)."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
